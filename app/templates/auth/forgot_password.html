{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="auth-card">
  <a class="auth-brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">C</span> Campaign Atlas</a>
  <p class="eyebrow mt-4 mb-1">ACCOUNT RECOVERY</p>
  <h1 class="auth-title">Forgot your password?</h1>
  <p class="text-secondary mb-4">Enter your account email and we’ll send a one-time reset link.</p>
  <form method="post" action="{{ url_for('auth.forgot_password_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">
    </div>
    <button class="btn btn-primary w-100" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="m4 8 8 6 8-6M16 4h4v4"/></svg>Send reset link</button>
  </form>
  <p class="auth-switch mb-0 mt-4"><a class="auth-link" href="{{ url_for('auth.login') }}">Back to sign in</a></p>
</div>
{% endblock %}
