{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-card">
  <a class="auth-brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">C</span> Campaign Atlas</a>
  <p class="eyebrow mt-4 mb-1">WELCOME BACK</p>
  <h1 class="auth-title">Sign in</h1>
  <p class="text-secondary mb-4">Access your campaign analytics workspace.</p>
  <form method="post" action="{{ url_for('auth.login_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="d-flex justify-content-end mb-4">
      <a class="auth-link small" href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
    </div>
    <button class="btn btn-primary w-100" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>Sign in</button>
  </form>
  <p class="auth-switch mb-0 mt-4">New to Campaign Atlas? <a class="auth-link" href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
