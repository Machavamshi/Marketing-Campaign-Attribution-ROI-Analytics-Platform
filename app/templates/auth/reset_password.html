{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="auth-card">
  <a class="auth-brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">C</span> Campaign Atlas</a>
  <p class="eyebrow mt-4 mb-1">ACCOUNT RECOVERY</p>
  <h1 class="auth-title">Choose a new password</h1>
  <p class="text-secondary mb-4">Use at least 6 characters, including an uppercase letter, a number, and a special character.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="password">New password</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
    </div>
    <div class="mb-4">
      <label class="form-label" for="confirm_password">Confirm new password</label>
      <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required>
    </div>
    <button class="btn btn-primary w-100" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h12l3 3v13H4V4h1Z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>Save new password</button>
  </form>
</div>
{% endblock %}
