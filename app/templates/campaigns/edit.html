{% extends "base.html" %}
{% block title %}Edit campaign{% endblock %}
{% block content %}
<div class="page-heading mb-4"><a class="small" href="{{ url_for('campaigns.detail', campaign_id=campaign.campaign_id) }}">← Campaign details</a><p class="eyebrow mt-3 mb-1">{{ campaign.campaign_id }}</p><h1>Edit campaign</h1><p class="text-secondary">Each edit adds an immutable before/after record to campaign history.</p></div>
<section class="panel" style="max-width:720px"><form method="post" class="row g-3"><div class="col-12"><label class="form-label" for="name">Campaign name</label><input id="name" name="name" class="form-control" value="{{ campaign.name }}" required maxlength="160"></div><div class="col-12"><label class="form-label" for="budget_amount">Budget ({{ config.BASE_CURRENCY }})</label><input id="budget_amount" name="budget_amount" class="form-control" type="number" min="0" step="0.01" value="{{ campaign.budget_amount }}" required></div><div class="col-12"><button class="btn btn-primary"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h12l3 3v13H4V4h1Z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>Save revision</button></div></form></section>
{% endblock %}
